[package]
name = "dellfans-tray"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
# Test builds only (fakesvc / measure scripts): DELLFANS_PIPE override and no server identity check. Never ship.
test-hooks = []

[dependencies]
dfcore = { workspace = true }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes",
  "Win32_System_Registry", "Win32_Globalization", "Win32_Security",
] }
