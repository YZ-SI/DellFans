[package]
name = "dellfans-testtools"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
dfcore = { workspace = true }
serde_json = { workspace = true }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO",
  "Win32_Security",
] }

[[bin]]
name = "dellfans-fakesvc"
path = "src/bin/fakesvc.rs"

[[bin]]
name = "dellfans-clistub"
path = "src/bin/clistub.rs"
